name: AstroScanr Daily Incremental + Monthly Analysis

on:
  schedule:
    - cron: '0 0 * * *'     # Every day at 00:00 UTC (daily incremental build)
    - cron: '0 2 1 * *'     # 1st of month at 02:00 UTC (monthly extended analysis)
  workflow_dispatch:        # Manual trigger

jobs:
  daily-incremental:
    if: github.event.schedule == '0 0 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - run: pip install -r requirements.txt
      
      - name: Daily incremental build (resumes from checkpoint)
        env:
          ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
        run: |
          python3 astroscanr.py
      
      - name: Prepare artifacts
        run: |
          mkdir -p docs
          mv astroscanr-*.png docs/ 2>/dev/null || true
          mv astroscanr-stats.csv docs/ 2>/dev/null || true
      
      - name: Commit results
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f docs/astroscanr-*.png docs/astroscanr-stats.csv data/historical_papers.json
          git commit -m "Auto: daily incremental build ($(date +%Y-%m-%d))" || exit 0
          git push

  monthly-extended:
    if: github.event.schedule == '0 2 1 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - run: pip install -r requirements.txt
      
      - name: Monthly extended analysis (plots 7-10)
        env:
          ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
        run: |
          python3 astroscanr-extended.py
      
      - name: Also run current year update (since cache is built)
        env:
          ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
        run: |
          python3 astroscanr.py --current-year-only
      
      - name: Prepare artifacts
        run: |
          mkdir -p docs
          mv astroscanr-*.png docs/ 2>/dev/null || true
          mv astroscanr-stats.csv docs/ 2>/dev/null || true
      
      - name: Commit results
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f docs/astroscanr-*.png docs/astroscanr-stats.csv
          git commit -m "Auto: monthly extended analysis + current year refresh ($(date +%Y-%m-%d))" || exit 0
          git push
