name: AstroScanr Daily Incremental + Monthly Analysis

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-incremental:
    if: github.event.schedule == '0 0 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - run: pip install -r requirements.txt

      - name: Daily incremental build (SQLite, resumes from checkpoint)
        env:
          ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
        run: |
          python3 astroscanr.py
      
      - name: Export aggregated stats CSV (all journals)
        run: |
          python3 export_csv.py --output docs/astroscanr-stats.csv
      
      - name: Export per-journal stats CSV (for dashboard filtering)
        run: |
          python3 export_csv.py --journals all --output docs/astroscanr-stats-by-journal.csv
      
      - name: Prepare and commit results
        run: |
          mkdir -p docs
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f docs/astroscanr-*.png docs/astroscanr-*.csv data/fetch_checkpoint.json astroscanr.db
          git commit -m "Auto: daily build + analysis ($(date +%Y-%m-%d))" || exit 0
          git push

  monthly-extended:
    if: github.event.schedule == '0 2 1 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - run: pip install -r requirements.txt

      - name: Monthly extended analysis (plots 7-10)
        env:
          ADS_API_KEY: ${{ secrets.ADS_API_KEY }}
        run: |
          python3 astroscanr-extended.py
      
      - name: Export per-journal stats for extended analysis
        run: |
          python3 export_csv.py --journals all --output docs/astroscanr-stats-by-journal.csv
      
      - name: Prepare and commit results
        run: |
          mkdir -p docs
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -f docs/astroscanr-*.png docs/astroscanr-*.csv
          git commit -m "Auto: monthly extended analysis ($(date +%Y-%m-%d))" || exit 0
          git push
